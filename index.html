<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uncanny weather website</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');

        body {
            display: flex;
            background-color: #1a1919;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Outfit", sans-serif;
            color: rgb(202, 202, 202);
        }

        input {
            background-color: rgb(49, 49, 49);
            height: 50px;
            width: 200px;
            border-style: solid;
            border-width: 1px;
            border-color: #525252;
            border-radius: 18px;
            font-family: "Outfit", sans-serif;
            font-size: 15px;
            color: rgb(202, 202, 202);
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1em;
            width: 250px;
        }

        button {
            background-color: rgb(49, 49, 49);
            height: 50px;
            width: 200px;
            border-style: solid;
            border-width: 1px;
            border-color: #525252;
            border-radius: 18px;
            cursor: pointer;
            font-family: "Outfit", sans-serif;
            font-size: 15px;
            color: rgb(202, 202, 202);
            transition: 0.1s ease;
        }

        button:hover {
            transform: scale(1.03);
        }

        button.clicked {
            transform: scale(0.95);
            transition: 0.1s ease;
        }

        #burger.clicked {
            transform: scale(0.95);
            transition: 0.1s ease;
        }

        .first,
        .second {
            display: flex;
            justify-content: space-between;
            gap: 1em;
        }

        .divwrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1em;
            padding: 2.5em 2em 1.5em 2.5em;
            background-color: #131212;
            border-radius: 22px;
            border-style: solid;
            border-width: 1px;
            border-color: #353535;
        }

        .tempdiv {
            width: 75px;
            height: 75px;
            background-color: rgb(49, 49, 49);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            border-style: solid;
            border-width: 1px;
            border-color: #525252;
            
        }

        .thirdp {
            text-align: center;
        }

        .tempdiv p {
            margin: 6px;
            font-size: 20px;
        }

        .tempdiv p:last-child {
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <h1>weather</h1>
    <form action="" id="id">
        <input type="text" id="content">
        <button id="submit-id">click to search!</button>
        <button id="burger" onclick="getLocation()">check your location</button>
    </form>
    <h2 id="temperaturetext">temperatures will show here!</h2>
    <div id="divid" class="divwrap">
        <div class="first">
            <div class="wrapper">
                <div class="tempdiv">
                    <strong>

                </div>

            </div>
            <div class="wrapper">
                <div class="tempdiv">

                        <p class="firstp">--°C</p>
                    </strong>
                    <p class="secondp">--°C</p>
                </div>
                <p class="thirdp">Monday</p>
            </div>
            <div class="wrapper">
                <div class="tempdiv">
                    <strong>
                        <p class="firstp">--°C</p>
                    </strong>
                    <p class="secondp">--°C</p>
                </div>
                <p class="thirdp">Tuesday</p>
            </div>
        </div>
        <div class="first">
            <div class="wrapper">
                <div class="tempdiv">

                    </strong>
                    <p class="secondp">--°C</p>
                </div>
                <p class="thirdp">Wednesday</p>
            </div>
            <div class="wrapper">
                <div class="tempdiv">

                        <p class="firstp">--°C</p>
                    </strong>
                    <p class="secondp">--°C</p>
                </div>
                <p class="thirdp">Thursday</p>

            <div class="wrapper">
                <div class="tempdiv">
                    <strong>
                        <p class="firstp">--°C</p>

                </div>

                    <p class="secondp">--°C</p>

    </div>
    <script>

        btn = document.getElementById("submit-id");

        btn.addEventListener('mousedown', () => {
            btn.classList.add('clicked');
        })

        btn.addEventListener('mouseup', () => {
            btn.classList.remove('clicked')
        })

        btn2 = document.getElementById("burger");

        btn2.addEventListener('mousedown', () => {
            btn2.classList.add('clicked');
        })

        btn2.addEventListener('mouseup', () => {
            btn2.classList.remove('clicked')
        })

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        console.log("Latitude:", lat);
                        console.log("Longitude:", lon);

                        getWeather(lat, lon);
                    },
                    (error) => {
                        console.error("Geolocation error:", error.message);
                        x.innerHTML = "Could not retrieve your location.";
                    }

                );
            }
        }

        document.getElementById("id").addEventListener("submit", function (e) {
            e.preventDefault();
            const input = document.getElementById("content").value;
            const token = 'pk.eyJ1IjoibWlkbmlnaHRtYXJpc3NhIiwiYSI6ImNtdTlvbXE5bzAzemoyd3M3aHBzNTgybnEifQ.n65gTo49i7D5nrgs_bLfIg';
            const newurl = `https://api.mapbox.com/search/geocode/v6/forward?q=${input}&types=place&autocomplete=false&access_token=${token}`;
            let text = document.getElementById("temperaturetext");

            if (input.trim() === "") {
                return;
            }

            console.log(input);
            fetch(newurl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response has failed!');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Geocode data:', data);
                    const feature = data.features && data.features[0];
                    if (!feature) {
                        console.error('No location found for that search.');
                        return;
                    }
                    const [lon, lat] = feature.geometry.coordinates;
                    console.log(`lat: ${lat}, lon: ${lon}`);

                    getWeather(lat, lon);
                })
                .catch(error => {
                    console.error('There was a problem with fetching:', error);
                });
        });

        function getWeather(lat, lon) {
            const days = 7;
            const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min&forecast_days=${days}&timezone=auto`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response has failed!');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Weather data:', data);
                    const wrapdiv = document.getElementById("divid");
                    const divs = wrapdiv.querySelectorAll(".wrapper");
                    const { time, temperature_2m_max, temperature_2m_min } = data.daily;
                    const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                    time.forEach((date, i) => {
                        if (divs[i]) {
                            const highP = divs[i].querySelector(".firstp");
                            const lowP = divs[i].querySelector(".secondp");
                            const thirdP = divs[i].querySelector(".thirdp");
                            const weekday = new Date(date);
                            if (highP) highP.textContent = `${Math.round(temperature_2m_max[i])}°C`;
                            if (lowP) lowP.textContent = `${Math.round(temperature_2m_min[i])}°C`;
                            if (thirdP) thirdP.textContent = `${weekdays[weekday.getDay()]}`;
                        }
                        console.log(`${date}: high ${temperature_2m_max[i]}${data.daily_units.temperature_2m_max}, low ${temperature_2m_min[i]}${data.daily_units.temperature_2m_max}`);
                    });
                })
                .catch(error => {
                    console.error('There was a problem with getting your fetch operation:', error);
                });
        }
    </script>
</body>

</html>
